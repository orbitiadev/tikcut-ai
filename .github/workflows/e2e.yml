name: Browser E2E

on:
  pull_request:
  workflow_dispatch:

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium for Playwright
        run: npx playwright install chromium
      - name: Verify branded Chrome for H.264 QA
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          else
            google-chrome-stable --version
          fi
      - name: Install pinned media QA binaries
        run: |
          npm install --no-save --no-audit --no-fund ffmpeg-static@5.3.0 @derhuerst/ffprobe-static@5.3.0
          npm approve-scripts ffmpeg-static @derhuerst/ffprobe-static
          npm rebuild ffmpeg-static @derhuerst/ffprobe-static
          FFMPEG_BIN="$(node -e "process.stdout.write(require('ffmpeg-static'))")"
          FFPROBE_BIN="$(node -e "process.stdout.write(require('@derhuerst/ffprobe-static').path)")"
          mkdir -p "$PWD/.qa-bin"
          ln -sf "$FFMPEG_BIN" "$PWD/.qa-bin/ffmpeg"
          ln -sf "$FFPROBE_BIN" "$PWD/.qa-bin/ffprobe"
          echo "$PWD/.qa-bin" >> "$GITHUB_PATH"
          echo "FFMPEG_BIN=$FFMPEG_BIN" >> "$GITHUB_ENV"
          echo "FFPROBE_BIN=$FFPROBE_BIN" >> "$GITHUB_ENV"
          "$FFMPEG_BIN" -version | sed -n '1p'
          "$FFPROBE_BIN" -version | sed -n '1p'
      - name: Generate 65-minute WebM and H.264 MP4 fixtures
        run: |
          mkdir -p tests/fixtures
          "$FFMPEG_BIN" -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=160x90:rate=1" \
            -f lavfi -i "aevalsrc=if(lt(mod(t\,12)\,8)\,0.12*sin(2*PI*440*t)\,0):s=16000:d=3905" \
            -t 3905 -c:v libvpx -deadline realtime -cpu-used 8 -b:v 80k -pix_fmt yuv420p \
            -c:a libopus -b:a 20k -shortest tests/fixtures/long-65min.webm
          "$FFMPEG_BIN" -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=160x90:rate=1" \
            -f lavfi -i "aevalsrc=if(lt(mod(t\,12)\,8)\,0.12*sin(2*PI*440*t)\,0):s=16000:d=3905" \
            -t 3905 -c:v libx264 -preset ultrafast -tune zerolatency -b:v 80k -g 30 -pix_fmt yuv420p \
            -c:a aac -b:a 24k -movflags +faststart -shortest tests/fixtures/long-65min-h264.mp4
          echo "WebM fixture:"
          "$FFPROBE_BIN" -v error -show_entries format=duration,size -of default=nw=1 tests/fixtures/long-65min.webm
          echo "H.264 MP4 fixture:"
          "$FFPROBE_BIN" -v error -show_entries format=duration,size -of default=nw=1 tests/fixtures/long-65min-h264.mp4
      - name: Typecheck and build
        run: npm run build
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/tikcut-preview.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tikcut-preview.log
          exit 1
      - name: Run real browser tests
        run: npm run test:e2e
      - name: Upload QA evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-qa-evidence
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
