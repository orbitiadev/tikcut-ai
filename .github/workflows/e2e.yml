name: Browser E2E

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: browser-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser QA dependencies without native postinstall downloads
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node scripts/copy-ffmpeg-core.mjs
      - name: Install Chromium for Playwright
        run: npx playwright install chromium
      - name: Ensure branded Chrome is available for H.264 QA
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            google-chrome-stable --version
          else
            npx playwright install chrome
          fi
      - name: Ensure ffmpeg tools are available
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "Using ffmpeg already available on runner"
          else
            for attempt in 1 2 3; do
              echo "Installing ffmpeg, attempt ${attempt}/3"
              if timeout 150s sudo apt-get -o Acquire::Retries=2 -o Dpkg::Lock::Timeout=45 install -y --no-install-recommends ffmpeg; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                echo "ffmpeg installation failed after bounded retries"
                exit 1
              fi
              sleep $((attempt * 5))
            done
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | sed -n '1p'
      - name: Generate long-video and Finalizer fixtures
        run: |
          mkdir -p tests/fixtures
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=160x90:rate=1" \
            -f lavfi -i "aevalsrc=if(lt(mod(t\,12)\,8)\,0.12*sin(2*PI*440*t)\,0):s=16000:d=3905" \
            -t 3905 -c:v libvpx -deadline realtime -cpu-used 8 -b:v 80k -pix_fmt yuv420p \
            -c:a libopus -b:a 20k -shortest tests/fixtures/long-65min.webm
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=160x90:rate=1" \
            -f lavfi -i "aevalsrc=if(lt(mod(t\,12)\,8)\,0.12*sin(2*PI*440*t)\,0):s=16000:d=3905" \
            -t 3905 -c:v libx264 -preset ultrafast -tune zerolatency -b:v 80k -g 30 -pix_fmt yuv420p \
            -c:a aac -b:a 24k -movflags +faststart -shortest tests/fixtures/long-65min-h264.mp4
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=96x54:rate=1/4" \
            -t 7505 -c:v libx264 -preset ultrafast -crf 36 -g 30 -pix_fmt yuv420p \
            -movflags +faststart tests/fixtures/long-125min-h264.mp4
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "color=c=black:size=360x640:rate=30" \
            -f lavfi -i "sine=frequency=440:sample_rate=44100" \
            -t 6 -c:v libx264 -preset ultrafast -crf 26 -pix_fmt yuv420p \
            -c:a aac -b:a 64k -movflags +faststart -shortest tests/fixtures/short-6s.mp4
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "color=c=black:size=360x640:rate=30" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000" \
            -t 6 -c:v libvpx -deadline realtime -cpu-used 8 -b:v 160k -pix_fmt yuv420p \
            -c:a libopus -b:a 48k -shortest tests/fixtures/short-6s.webm
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "sine=frequency=220:sample_rate=44100" \
            -t 2 -c:a pcm_s16le tests/fixtures/music-2s.wav
          echo "WebM fixture:"
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 tests/fixtures/long-65min.webm
          echo "H.264 MP4 fixture:"
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 tests/fixtures/long-65min-h264.mp4
          echo "2h05 H.264 MP4 fixture:"
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 tests/fixtures/long-125min-h264.mp4
          echo "Finalizer MP4 fixture:"
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 tests/fixtures/short-6s.mp4
          echo "Finalizer WebM fixture:"
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 tests/fixtures/short-6s.webm
      - name: Typecheck and build
        run: npm run build
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/tikcut-preview.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tikcut-preview.log
          exit 1
      - name: Run real browser tests
        run: npm run test:e2e
      - name: Upload QA evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-qa-evidence
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
